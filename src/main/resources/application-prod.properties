# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true

# Em produção, a identificação do controlador é obrigatória.
app.privacy.controller-name=${APP_PRIVACIDADE_CONTROLADOR}
app.privacy.contact=${APP_PRIVACIDADE_CONTATO}
app.privacy.officer=${APP_PRIVACIDADE_ENCARREGADO}
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
