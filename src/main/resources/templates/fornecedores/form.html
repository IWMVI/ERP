<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fornecedor | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="content">
    <div class="page-heading">
        <div>
            <h1 th:text="${id == null ? 'Novo fornecedor' : 'Editar fornecedor'}"></h1>
            <p class="muted">Dados cadastrais, contato e endereço.</p>
        </div>
    </div>
    <form th:action="${id == null} ? @{/fornecedores} : @{/fornecedores/{id}(id=${id})}"
          th:object="${fornecedorRequest}"
          method="post"
          class="panel panel-body form-panel">
        <div class="form-grid">
            <div>
                <label for="nome">Nome</label>
                <input id="nome" th:field="*{nome}">
                <small class="field-error" th:errors="*{nome}"></small>
            </div>
            <div>
                <label for="documento">CPF/CNPJ</label>
                <input id="documento" th:field="*{documento}">
                <small class="field-error" th:errors="*{documento}"></small>
            </div>
            <div>
                <label for="email">E-mail</label>
                <input id="email" type="email" th:field="*{email}">
            </div>
            <div>
                <label for="telefone">Telefone</label>
                <input id="telefone" th:field="*{telefone}">
            </div>
            <div>
                <label for="cep">CEP</label>
                <input id="cep" th:field="*{cep}">
            </div>
            <div class="full-width">
                <label for="logradouro">Logradouro</label>
                <input id="logradouro" th:field="*{logradouro}">
            </div>
            <div>
                <label for="numero">Número</label>
                <input id="numero" th:field="*{numero}">
            </div>
            <div>
                <label for="cidade">Cidade</label>
                <input id="cidade" th:field="*{cidade}">
            </div>
            <div>
                <label for="estado">UF</label>
                <input id="estado" th:field="*{estado}" maxlength="2">
            </div>
        </div>
        <div class="actions">
            <a class="button secondary" th:href="@{/fornecedores}">Cancelar</a>
            <button type="submit">Salvar</button>
        </div>
    </form>
</main>
</body>
</html>
