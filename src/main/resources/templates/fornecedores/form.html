<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fornecedor | ERP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="content"><div class="page-heading"><div><h1 th:text="${id==null?'Novo fornecedor':'Editar fornecedor'}"></h1><p class="muted">Dados cadastrais, contato e endereço.</p></div></div><form th:action="${id==null}?@{/fornecedores}:@{/fornecedores/{id}(id=${id})}" th:object="${fornecedorRequest}" method="post" class="panel panel-body form-panel"><div class="form-grid"><div><label>Nome</label><input th:field="*{nome}"><small class="field-error" th:errors="*{nome}"></small></div><div><label>CPF/CNPJ</label><input th:field="*{documento}"><small class="field-error" th:errors="*{documento}"></small></div><div><label>E-mail</label><input type="email" th:field="*{email}"></div><div><label>Telefone</label><input th:field="*{telefone}"></div><div><label>CEP</label><input th:field="*{cep}"></div><div class="full-width"><label>Logradouro</label><input th:field="*{logradouro}"></div><div><label>Número</label><input th:field="*{numero}"></div><div><label>Cidade</label><input th:field="*{cidade}"></div><div><label>UF</label><input th:field="*{estado}" maxlength="2"></div></div><div class="actions"><a class="button secondary" th:href="@{/fornecedores}">Cancelar</a><button type="submit">Salvar</button></div></form></main></body></html>
