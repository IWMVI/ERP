<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fornecedor | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/cadastros.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('fornecedores')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Cadastros / Fornecedores')}"></header>
        <main class="content registry-page">
            <div class="registry-page-header">
                <h1 th:text="${id == null ? 'Novo fornecedor' : 'Editar fornecedor'}"></h1>
                <p>Dados cadastrais e de contato.</p>
            </div>

            <form class="registry-form-stack"
                  th:action="${id == null} ? @{/fornecedores} : @{/fornecedores/{id}(id=${id})}"
                  th:object="${fornecedorRequest}"
                  method="post">
                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Dados cadastrais</h2></div>
                    <div class="panel-body form-grid">
                        <div class="field-group full-width">
                            <label for="documento">CPF / CNPJ</label>
                            <div class="lookup-field-row">
                                <input id="documento"
                                       th:field="*{documento}"
                                       data-mask="documento"
                                       data-documento-pessoa
                                       data-lookup-cnpj
                                       inputmode="numeric"
                                       autocomplete="off">
                                <button type="button"
                                        class="button secondary lookup-button"
                                        data-action="consultar-cnpj"
                                        data-default-label="Consultar CNPJ"
                                        hidden>
                                    <span data-button-label>Consultar CNPJ</span>
                                </button>
                            </div>
                            <small class="document-type" data-documento-tipo>Informe CPF ou CNPJ</small>
                            <small data-lookup-status class="field-hint"></small>
                            <small class="field-error" th:errors="*{documento}"></small>
                        </div>
                        <div><label for="nome">Nome / Razão social</label><input id="nome" th:field="*{nome}"><small class="field-error" th:errors="*{nome}"></small></div>
                        <div><label for="nomeFantasia">Nome fantasia</label><input id="nomeFantasia" th:field="*{nomeFantasia}"></div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Contato</h2></div>
                    <div class="panel-body form-grid form-grid-three">
                        <div><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" autocomplete="email"></div>
                        <div><label for="telefone">Telefone</label><input id="telefone" th:field="*{telefone}" data-mask="telefone" inputmode="tel" autocomplete="tel"></div>
                        <div><label for="celular">Celular</label><input id="celular" th:field="*{celular}" data-mask="celular" inputmode="tel"></div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Endereço</h2></div>
                    <div class="panel-body form-grid">
                        <div class="field-group">
                            <label for="cep">CEP</label>
                            <input id="cep" th:field="*{cep}" data-mask="cep" data-lookup-cep inputmode="numeric" autocomplete="postal-code">
                            <small data-lookup-status class="field-hint"></small>
                            <small class="field-error" th:errors="*{cep}"></small>
                        </div>
                        <div><label for="numero">Número</label><input id="numero" th:field="*{numero}"></div>
                        <div class="full-width"><label for="logradouro">Logradouro</label><input id="logradouro" th:field="*{logradouro}" autocomplete="address-line1"></div>
                        <div><label for="complemento">Complemento</label><input id="complemento" th:field="*{complemento}"></div>
                        <div><label for="bairro">Bairro</label><input id="bairro" th:field="*{bairro}"></div>
                        <div><label for="cidade">Cidade</label><input id="cidade" th:field="*{cidade}" autocomplete="address-level2"></div>
                        <div><label for="estado">UF</label><input id="estado" th:field="*{estado}" maxlength="2" autocomplete="address-level1"></div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Observações</h2></div>
                    <div class="panel-body"><textarea id="observacoes" th:field="*{observacoes}" rows="4" maxlength="1000"></textarea></div>
                </section>

                <div class="registry-form-actions">
                    <div class="registry-actions-buttons">
                        <a class="button secondary" th:href="@{/fornecedores}">Cancelar</a>
                        <button type="submit">Salvar</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/cadastros.js}" defer></script>
</body>
</html>
