<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fornecedores | ERP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside class="sidebar"><a th:href="@{/}" class="sidebar-brand"><span class="brand-mark">ERP</span><span>Gestão Empresarial</span></a><nav class="sidebar-nav"><a th:href="@{/}" class="nav-item">Início</a><span class="sidebar-section-title">Cadastros</span><a th:href="@{/clientes}" class="nav-item">Clientes</a><a th:href="@{/fornecedores}" class="nav-item active">Fornecedores</a><a th:href="@{/produtos}" class="nav-item">Produtos</a><a th:href="@{/estoque}" class="nav-item">Estoque</a></nav></aside><div class="app-main"><header class="topbar"><span class="topbar-title">Fornecedores</span></header><main class="content"><div class="page-heading"><div><h1>Fornecedores</h1><p class="muted">Parceiros e contatos de compra.</p></div><a class="button" th:href="@{/fornecedores/novo}">Novo fornecedor</a></div><div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div><div class="table-wrapper"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Contato</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="f:${fornecedores}"><td th:text="${f.nome}"></td><td th:text="${f.documento}"></td><td th:text="${f.email}"></td><td><span class="badge" th:text="${f.ativo?'Ativo':'Inativo'}"></span></td><td><a th:href="@{/fornecedores/{id}/editar(id=${f.id})}">Editar</a> <form class="inline-form" th:action="@{/fornecedores/{id}/status(id=${f.id})}" method="post"><button class="link-button" type="submit" th:text="${f.ativo?'Inativar':'Ativar'}"></button></form></td></tr></tbody></table></div></main></div></div></body></html>
