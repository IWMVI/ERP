<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo usuário | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/cadastros.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Administração / Usuários / Novo')}"></header>
        <main class="content registry-page">
            <div class="registry-page-header">
                <h1>Novo usuário</h1>
                <p>Dados de acesso e permissão.</p>
            </div>

            <form class="registry-form-stack" th:action="@{/usuarios}" th:object="${usuarioRequest}" method="post">
                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Identificação</h2></div>
                    <div class="panel-body form-grid">
                        <div class="full-width"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" type="text" autocomplete="name" required><small class="field-error" th:errors="*{nome}"></small></div>
                        <div><label for="email">E-mail</label><input id="email" th:field="*{email}" type="email" autocomplete="email" required><small class="field-error" th:errors="*{email}"></small></div>
                        <div><label for="senha">Senha inicial</label><input id="senha" th:field="*{senha}" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><small class="field-error" th:errors="*{senha}"></small></div>
                        <div><label for="perfil">Perfil</label><select id="perfil" th:field="*{perfil}" required><option value="">Selecione</option><option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil}"></option></select><small class="field-error" th:errors="*{perfil}"></small></div>
                    </div>
                </section>

                <div class="registry-form-actions">
                    <div class="registry-actions-buttons">
                        <th:block th:replace="~{fragments/buttons :: link(@{/usuarios}, 'Cancelar', 'secondary')}"></th:block>
                        <th:block th:replace="~{fragments/buttons :: action('Salvar', 'submit', null, null, null)}"></th:block>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
