<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo usuário | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a th:href="@{/}" class="sidebar-brand">
            <span class="brand-mark">ERP</span>
            <span>Gestão Empresarial</span>
        </a>
        <nav class="sidebar-nav">
            <span class="sidebar-section-title">Principal</span>
            <a th:href="@{/}" class="nav-item">
                <span class="nav-symbol">IN</span>
                <span>Início</span>
            </a>
            <span class="sidebar-section-title">Administração</span>
            <a th:href="@{/usuarios}" class="nav-item active">
                <span class="nav-symbol">US</span>
                <span>Usuários</span>
            </a>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer">ERP · Ambiente de gestão</div>
    </aside>

    <div class="app-main">
        <header class="topbar">
            <span class="topbar-title">Administração / Usuários / Novo</span>
            <form th:action="@{/logout}" method="post">
                <button class="link-button" type="submit">Sair</button>
            </form>
        </header>

        <main class="content">
            <div class="page-heading">
                <div>
                    <h1>Novo usuário</h1>
                    <p class="muted">Cadastre um acesso interno e defina o nível de permissão.</p>
                </div>
            </div>

            <section class="panel form-panel">
                <div class="panel-header">
                    <h2>Dados de acesso</h2>
                </div>
                <div class="panel-body">
                    <form th:action="@{/usuarios}" th:object="${usuarioRequest}" method="post">
                        <div class="form-grid">
                            <div class="full-width">
                                <label for="nome">Nome</label>
                                <input id="nome" th:field="*{nome}" type="text" autocomplete="name" required>
                                <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
                            </div>

                            <div>
                                <label for="email">E-mail</label>
                                <input id="email" th:field="*{email}" type="email" autocomplete="email" required>
                                <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                            </div>

                            <div>
                                <label for="senha">Senha inicial</label>
                                <input id="senha" th:field="*{senha}" type="password" autocomplete="new-password" minlength="6" required>
                                <small class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>
                            </div>

                            <div>
                                <label for="perfil">Perfil</label>
                                <select id="perfil" th:field="*{perfil}" required>
                                    <option value="">Selecione</option>
                                    <option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil}"></option>
                                </select>
                                <small class="field-error" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></small>
                            </div>
                        </div>

                        <div class="actions">
                            <a class="button secondary" th:href="@{/usuarios}">Cancelar</a>
                            <button type="submit">Cadastrar usuário</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
