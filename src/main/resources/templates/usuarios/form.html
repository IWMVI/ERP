<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo usuário | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a th:href="@{/}" class="brand">ERP</a></header>
<main class="container narrow">
    <h1>Novo usuário</h1>
    <form th:action="@{/usuarios}" th:object="${usuarioRequest}" method="post" class="form-stack">
        <label for="nome">Nome</label>
        <input id="nome" th:field="*{nome}" type="text">
        <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>

        <label for="email">E-mail</label>
        <input id="email" th:field="*{email}" type="email">
        <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

        <label for="senha">Senha</label>
        <input id="senha" th:field="*{senha}" type="password">
        <small class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>

        <label for="perfil">Perfil</label>
        <select id="perfil" th:field="*{perfil}">
            <option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil}"></option>
        </select>
        <small class="field-error" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></small>

        <div class="actions">
            <a class="button secondary" th:href="@{/usuarios}">Cancelar</a>
            <button type="submit">Cadastrar</button>
        </div>
    </form>
</main>
</body>
</html>
