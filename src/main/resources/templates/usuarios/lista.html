<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a th:href="@{/}" class="brand">ERP</a>
    <form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Sair</button></form>
</header>
<main class="container">
    <div class="page-heading">
        <div><h1>Usuários</h1><p class="muted">Gerencie quem pode acessar o sistema.</p></div>
        <a class="button" th:href="@{/usuarios/novo}">Novo usuário</a>
    </div>

    <div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nome}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.perfil}"></td>
                <td><span class="badge" th:text="${usuario.ativo ? 'Ativo' : 'Inativo'}"></span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="4">Nenhum usuário cadastrado.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
