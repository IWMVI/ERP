<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido de venda | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('vendas')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Operação / Vendas / Pedido')}"></header>
        <main class="content registry-page">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div class="page-heading">
                <div>
                    <h1 th:text="${'Pedido de venda #' + pedido.id}"></h1>
                    <p class="muted" th:text="${pedido.clienteNome + ' · ' + #temporals.format(pedido.dataCriacao, 'dd/MM/yyyy HH:mm')}"></p>
                </div>
                <a class="button secondary" th:href="@{/vendas}">Voltar</a>
            </div>

            <section class="dashboard-grid">
                <article class="metric-card"><div class="metric-label">Subtotal</div><div class="metric-value" th:text="${'R$ ' + #numbers.formatDecimal(pedido.subtotal, 1, 2)}"></div></article>
                <article class="metric-card"><div class="metric-label">Desconto</div><div class="metric-value" th:text="${'R$ ' + #numbers.formatDecimal(pedido.desconto, 1, 2)}"></div></article>
                <article class="metric-card"><div class="metric-label">Total</div><div class="metric-value" th:text="${'R$ ' + #numbers.formatDecimal(pedido.total, 1, 2)}"></div></article>
                <article class="metric-card"><div class="metric-label">Status</div><div class="metric-value" th:text="${pedido.status}"></div></article>
            </section>

            <section class="registry-card" th:if="${pedido.status.name() == 'RASCUNHO'}">
                <div class="panel-body">
                    <h2>Adicionar item</h2>
                    <form class="form-grid" th:action="@{/vendas/{id}/itens(id=${pedido.id})}" method="post">
                        <label>Produto
                            <select name="produtoId" required>
                                <option value="">Selecione</option>
                                <option th:each="produto : ${produtos}" th:if="${produto.ativo}" th:value="${produto.id}" th:text="${produto.codigo + ' - ' + produto.nome + ' · saldo ' + produto.saldoEstoque}"></option>
                            </select>
                        </label>
                        <label>Quantidade<input name="quantidade" type="number" min="0.001" step="0.001" required></label>
                        <div class="form-actions"><button type="submit">Adicionar item</button></div>
                    </form>
                </div>
            </section>

            <section class="registry-card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Produto</th><th>Quantidade</th><th>Preço unitário</th><th>Subtotal</th></tr></thead>
                        <tbody>
                        <tr th:each="item : ${pedido.itens}">
                            <td th:text="${item.produtoCodigo + ' - ' + item.produtoNome}"></td>
                            <td th:text="${item.quantidade}"></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 2)}"></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pedido.itens)}"><td colspan="4">Nenhum item adicionado.</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="registry-card" th:if="${pedido.status.name() == 'RASCUNHO'}">
                <div class="panel-body">
                    <h2>Condição de pagamento</h2>
                    <form class="form-grid" th:action="@{/vendas/{id}/concluir(id=${pedido.id})}" method="post">
                        <label>Parcelas<input name="parcelas" type="number" min="1" max="24" value="1" required></label>
                        <label>Primeiro vencimento<input name="primeiroVencimento" type="date" th:value="${vencimentoPadrao}" required></label>
                        <div class="form-actions">
                            <button type="submit">Concluir venda</button>
                        </div>
                    </form>
                </div>
            </section>

            <div class="form-actions" th:if="${pedido.status.name() == 'RASCUNHO'}">
                <form th:action="@{/vendas/{id}/cancelar(id=${pedido.id})}" method="post"><button class="secondary" type="submit">Cancelar pedido</button></form>
            </div>
            <div class="form-actions" th:if="${pedido.status.name() == 'CONCLUIDO'}">
                <form th:action="@{/vendas/{id}/estornar(id=${pedido.id})}" method="post"><button class="secondary" type="submit">Estornar venda</button></form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
