<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <strong>ERP</strong>
    <form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Sair</button></form>
</header>
<main class="container">
    <h1>Bem-vindo</h1>
    <p th:text="${email}"></p>
    <a class="button" th:if="${admin}" th:href="@{/usuarios}">Gerenciar usuários</a>
</main>
</body>
</html>
