<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('inicio')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Visão geral')}"></header>
        <main class="content">
            <div class="page-heading">
                <div>
                    <h1>Visão geral</h1>
                    <p class="muted">Acesse as rotinas operacionais e cadastros do sistema.</p>
                </div>
            </div>
            <section class="dashboard-grid">
                <article class="metric-card">
                    <div class="metric-label">Cadastros comerciais</div>
                    <div class="metric-value">Disponível</div>
                    <p class="muted">Clientes, fornecedores e catálogo de produtos.</p>
                </article>
                <article class="metric-card">
                    <div class="metric-label">Estoque</div>
                    <div class="metric-value">Controlado</div>
                    <p class="muted">Entradas, saídas, saldo mínimo e histórico rastreável.</p>
                </article>
                <article class="metric-card">
                    <div class="metric-label">Segurança</div>
                    <div class="metric-value">Ativa</div>
                    <p class="muted">Usuários, permissões e auditoria de operações.</p>
                </article>
            </section>
        </main>
    </div>
</div>
</body>
</html>
