<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Cadastros / Clientes')}"></header>
        <main class="content registry-page">
            <div class="page-heading">
                <div><h1>Clientes</h1><p class="muted">Pessoas físicas e jurídicas vinculadas à operação comercial.</p></div>
                <th:block th:replace="~{fragments/buttons :: link(@{/clientes/novo}, 'Novo cliente', null)}"></th:block>
            </div>
            <section class="registry-card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Contato</th><th>Status</th><th aria-label="Ações"></th></tr></thead>
                        <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.nome}"></td>
                            <td data-format="documento" th:text="${cliente.documento}"></td>
                            <td th:text="${cliente.email}"></td>
                            <td><span class="badge" th:classappend="${cliente.ativo} ? ' success'" th:text="${cliente.ativo ? 'Ativo' : 'Inativo'}"></span></td>
                            <td>
                                <details class="row-actions">
                                    <summary aria-label="Abrir ações do cliente" title="Ações"><svg class="row-actions-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></summary>
                                    <div class="row-actions-menu">
                                        <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
                                        <form th:action="@{/clientes/{id}/status(id=${cliente.id})}" method="post"><button type="submit" th:text="${cliente.ativo ? 'Inativar' : 'Ativar'}"></button></form>
                                    </div>
                                </details>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5">Nenhum cliente cadastrado.</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav th:replace="~{fragments/pagination :: pagination(${paginacao})}"></nav>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/cadastros.js}" defer></script>
</body>
</html>
