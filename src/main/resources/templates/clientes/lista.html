<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
    <div class="app-main">
        <header class="topbar"><span class="topbar-title">Cadastros / Clientes</span></header>
        <main class="content">
            <div class="page-heading">
                <div><h1>Clientes</h1><p class="muted">Cadastro de pessoas físicas e jurídicas.</p></div>
                <a class="button" th:href="@{/clientes/novo}">Novo cliente</a>
            </div>
            <div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Contato</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nome}"></td>
                        <td th:text="${cliente.documento}"></td>
                        <td th:text="${cliente.email}"></td>
                        <td><span class="badge" th:text="${cliente.ativo ? 'Ativo' : 'Inativo'}"></span></td>
                        <td>
                            <div class="user-menu">
                                <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
                                <form th:action="@{/clientes/{id}/status(id=${cliente.id})}" method="post">
                                    <button class="link-button" type="submit" th:text="${cliente.ativo ? 'Inativar' : 'Ativar'}"></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5">Nenhum cliente cadastrado.</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
