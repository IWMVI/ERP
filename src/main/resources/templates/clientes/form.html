<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/cadastros.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Cadastros / Clientes')}"></header>
        <main class="content registry-page">
            <div class="registry-page-header">
                <h1 th:text="${id == null ? 'Dados do cliente' : 'Editar cliente'}"></h1>
                <p th:text="${clienteRequest.tipoPessoa().name() == 'JURIDICA' ? 'Pessoa jurídica identificada pelo CNPJ.' : 'Pessoa física identificada pelo CPF.'}"></p>
            </div>

            <form class="registry-form-stack"
                  th:action="${id == null} ? @{/clientes} : @{/clientes/{id}(id=${id})}"
                  th:object="${clienteRequest}"
                  method="post">
                <input type="hidden" th:field="*{tipoPessoa}">

                <div class="alert warning" th:if="${avisoConsulta}" th:text="${avisoConsulta}"></div>
                <div class="alert success" th:if="${situacaoCadastral}" th:text="${'Situação cadastral do CNPJ: ' + situacaoCadastral}"></div>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Identificação</h2></div>
                    <div class="panel-body form-grid">
                        <div class="field-group">
                            <label for="documento" th:text="${clienteRequest.tipoPessoa().name() == 'JURIDICA' ? 'CNPJ' : 'CPF'}"></label>
                            <input id="documento"
                                   th:field="*{documento}"
                                   data-mask="documento"
                                   readonly
                                   aria-readonly="true">
                            <small class="document-type" th:text="${clienteRequest.tipoPessoa().name() == 'JURIDICA' ? 'Pessoa jurídica' : 'Pessoa física'}"></small>
                            <small class="field-error" th:errors="*{documento}"></small>
                        </div>
                        <div th:classappend="${clienteRequest.tipoPessoa().name() == 'FISICA'} ? ' full-width'">
                            <label for="nome" th:text="${clienteRequest.tipoPessoa().name() == 'JURIDICA' ? 'Razão social' : 'Nome completo'}"></label>
                            <input id="nome" th:field="*{nome}" autocomplete="name">
                            <small class="field-error" th:errors="*{nome}"></small>
                        </div>
                        <div th:if="${clienteRequest.tipoPessoa().name() == 'JURIDICA'}">
                            <label for="nomeFantasia">Nome fantasia</label>
                            <input id="nomeFantasia" th:field="*{nomeFantasia}">
                        </div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Contato</h2></div>
                    <div class="panel-body form-grid form-grid-three">
                        <div><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" autocomplete="email"><small class="field-error" th:errors="*{email}"></small></div>
                        <div><label for="telefone">Telefone</label><input id="telefone" th:field="*{telefone}" data-mask="telefone" inputmode="tel" autocomplete="tel"></div>
                        <div><label for="celular" th:text="${clienteRequest.tipoPessoa().name() == 'JURIDICA' ? 'Celular / WhatsApp' : 'Celular'}"></label><input id="celular" th:field="*{celular}" data-mask="celular" inputmode="tel"></div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Endereço</h2></div>
                    <div class="panel-body form-grid">
                        <div class="field-group">
                            <label for="cep">CEP</label>
                            <input id="cep" th:field="*{cep}" data-mask="cep" data-lookup-cep inputmode="numeric" autocomplete="postal-code">
                            <small data-lookup-status class="field-hint"></small>
                            <small class="field-error" th:errors="*{cep}"></small>
                        </div>
                        <div><label for="numero">Número</label><input id="numero" th:field="*{numero}"></div>
                        <div class="full-width"><label for="logradouro">Logradouro</label><input id="logradouro" th:field="*{logradouro}" autocomplete="address-line1"></div>
                        <div><label for="complemento">Complemento</label><input id="complemento" th:field="*{complemento}"></div>
                        <div><label for="bairro">Bairro</label><input id="bairro" th:field="*{bairro}"></div>
                        <div><label for="cidade">Cidade</label><input id="cidade" th:field="*{cidade}" autocomplete="address-level2"></div>
                        <div><label for="estado">UF</label><input id="estado" th:field="*{estado}" maxlength="2" autocomplete="address-level1"></div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Observações</h2></div>
                    <div class="panel-body"><textarea id="observacoes" th:field="*{observacoes}" rows="4" maxlength="1000"></textarea></div>
                </section>

                <div class="registry-form-actions">
                    <div class="registry-actions-buttons">
                        <th:block th:replace="~{fragments/buttons :: link(${id == null ? '/clientes/novo' : '/clientes'}, 'Voltar', 'secondary')}"></th:block>
                        <th:block th:replace="~{fragments/buttons :: action('Salvar cliente', 'submit', null, null, null)}"></th:block>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/cadastros.js}" defer></script>
</body>
</html>
