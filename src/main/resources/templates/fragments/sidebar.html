<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="sidebar" id="app-sidebar">
    <a th:href="@{/}" class="sidebar-brand">
        <span class="brand-mark">ERP</span>
        <span class="sidebar-label">Gestão Empresarial</span>
    </a>

    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-item nav-root" th:classappend="${activePage == 'inicio'} ? ' active'"
           title="Início">
            <i data-lucide="layout-dashboard" class="nav-icon" aria-hidden="true"></i>
            <span class="sidebar-label">Início</span>
        </a>

        <details class="nav-domain"
                 th:attr="open=${activePage == 'clientes' or activePage == 'fornecedores' or activePage == 'produtos'} ? 'open' : null">
            <summary class="nav-domain-toggle" title="Cadastros">
                <span class="nav-domain-label"><i data-lucide="users" class="nav-icon"
                    aria-hidden="true"></i><span
                    class="sidebar-label">Cadastros</span></span>
                <i data-lucide="chevron-right" class="nav-chevron" aria-hidden="true"></i>
            </summary>
            <div class="nav-submenu">
                <a th:href="@{/clientes}" class="nav-subitem" th:classappend="${activePage == 'clientes'} ? ' active'"
                   title="Clientes">
                    <i data-lucide="users" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Clientes</span></a>
                <a th:href="@{/fornecedores}" class="nav-subitem"
                   th:classappend="${activePage == 'fornecedores'} ? ' active'" title="Fornecedores">
                    <i data-lucide="truck" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Fornecedores</span></a>
                <a th:href="@{/produtos}" class="nav-subitem" th:classappend="${activePage == 'produtos'} ? ' active'"
                   title="Produtos">
                    <i data-lucide="package" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Produtos</span></a>
            </div>
        </details>

        <details class="nav-domain"
                 th:attr="open=${activePage == 'estoque' or activePage == 'estoque-movimentar' or activePage == 'vendas' or activePage == 'compras'} ? 'open' : null">
            <summary class="nav-domain-toggle" title="Operação">
                <span class="nav-domain-label"><i data-lucide="clipboard-list" class="nav-icon"
                    aria-hidden="true"></i><span
                    class="sidebar-label">Operação</span></span>
                <i data-lucide="chevron-right" class="nav-chevron" aria-hidden="true"></i>
            </summary>
            <div class="nav-submenu">
                <a th:href="@{/vendas}" class="nav-subitem" th:classappend="${activePage == 'vendas'} ? ' active'"
                   title="Vendas">
                    <i data-lucide="shopping-cart" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Vendas</span></a>
                <a th:href="@{/compras}" class="nav-subitem" th:classappend="${activePage == 'compras'} ? ' active'"
                   title="Compras">
                    <i data-lucide="square-menu" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Compras</span></a>
                <a th:href="@{/estoque}" class="nav-subitem" th:classappend="${activePage == 'estoque'} ? ' active'"
                   title="Estoque">
                    <i data-lucide="layers" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Estoque</span></a>
                <a th:href="@{/estoque/movimentar}" class="nav-subitem"
                   th:classappend="${activePage == 'estoque-movimentar'} ? ' active'" title="Nova movimentação">
                    <i data-lucide="arrow-down" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Nova movimentação</span></a>
            </div>
        </details>

        <details class="nav-domain"
                 th:attr="open=${activePage == 'financeiro-pagar' or activePage == 'financeiro-receber' or activePage == 'financeiro-extrato'} ? 'open' : null">
            <summary class="nav-domain-toggle" title="Financeiro">
                <span class="nav-domain-label"><i data-lucide="credit-card" class="nav-icon"
                    aria-hidden="true"></i><span
                    class="sidebar-label">Financeiro</span></span>
                <i data-lucide="chevron-right" class="nav-chevron" aria-hidden="true"></i>
            </summary>
            <div class="nav-submenu">
                <a th:href="@{/financeiro/pagar}" class="nav-subitem"
                   th:classappend="${activePage == 'financeiro-pagar'} ? ' active'" title="Contas a pagar">
                    <i data-lucide="clipboard-list" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Contas a pagar</span></a>
                <a th:href="@{/financeiro/receber}" class="nav-subitem"
                   th:classappend="${activePage == 'financeiro-receber'} ? ' active'" title="Contas a receber">
                    <i data-lucide="package" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Contas a receber</span></a>
                <a th:href="@{/financeiro/extrato}" class="nav-subitem"
                   th:classappend="${activePage == 'financeiro-extrato'} ? ' active'" title="Extrato">
                    <i data-lucide="list" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Extrato</span></a>
            </div>
        </details>

        <details class="nav-domain" th:if="${admin}"
                 th:attr="open=${activePage == 'usuarios' or activePage == 'auditoria'} ? 'open' : null">
            <summary class="nav-domain-toggle" title="Administração">
                <span class="nav-domain-label"><i data-lucide="shield-check" class="nav-icon"
                    aria-hidden="true"></i><span
                    class="sidebar-label">Administração</span></span>
                <i data-lucide="chevron-right" class="nav-chevron" aria-hidden="true"></i>
            </summary>
            <div class="nav-submenu">
                <a th:href="@{/usuarios}" class="nav-subitem" th:classappend="${activePage == 'usuarios'} ? ' active'"
                   title="Usuários">
                    <i data-lucide="user-plus" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Usuários</span></a>
                <a th:href="@{/auditoria}" class="nav-subitem" th:classappend="${activePage == 'auditoria'} ? ' active'"
                   title="Auditoria">
                    <i data-lucide="clock" class="nav-icon" aria-hidden="true"></i>
                    <span class="sidebar-label">Auditoria</span></a>
            </div>
        </details>
    </nav>

    <div class="sidebar-spacer"></div>
    <button type="button" class="sidebar-collapse-button" data-sidebar-toggle title="Minimizar menu"
            aria-label="Minimizar menu">
        <i data-lucide="chevron-left" class="nav-icon sidebar-collapse-icon" aria-hidden="true"></i>
        <span class="sidebar-label">Minimizar menu</span>
    </button>
    <div class="sidebar-footer sidebar-label"><a th:href="@{/privacidade}">Privacidade</a></div>
    <script th:src="@{/js/lucide.min.js}" defer></script>
    <script th:src="@{/js/icons.js}" defer></script>
    <script th:src="@{/js/navigation.js}" defer></script>
</aside>
</body>
</html>
