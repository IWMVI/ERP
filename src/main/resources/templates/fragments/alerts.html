<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alerts" class="toast-stack" aria-live="polite" aria-atomic="true">
    <div class="app-toast app-toast-success" role="status" th:if="${sucesso}" data-toast>
        <span class="app-toast-icon" aria-hidden="true">
            <i data-lucide="check" aria-hidden="true"></i>
        </span>
        <span class="app-toast-content">
            <strong>Sucesso</strong>
            <span th:text="${sucesso}"></span>
        </span>
        <button class="app-toast-close" type="button" data-toast-close aria-label="Fechar aviso">×</button>
    </div>

    <div class="app-toast app-toast-warning" role="status" th:if="${warning}" data-toast>
        <span class="app-toast-icon" aria-hidden="true">
            <i data-lucide="triangle-alert" aria-hidden="true"></i>
        </span>
        <span class="app-toast-content">
            <strong>Atenção</strong>
            <span th:text="${warning}"></span>
        </span>
        <button class="app-toast-close" type="button" data-toast-close aria-label="Fechar aviso">×</button>
    </div>

    <div class="app-toast app-toast-error" role="alert" th:if="${erroGlobal}" data-toast data-toast-persistent>
        <span class="app-toast-icon" aria-hidden="true">
            <i data-lucide="circle-alert" aria-hidden="true"></i>
        </span>
        <span class="app-toast-content">
            <strong>Erro</strong>
            <span th:text="${erroGlobal}"></span>
        </span>
        <button class="app-toast-close" type="button" data-toast-close aria-label="Fechar aviso">×</button>
    </div>

    <div class="app-toast app-toast-info" role="status" th:if="${info}" data-toast>
        <span class="app-toast-icon" aria-hidden="true">
            <i data-lucide="info" aria-hidden="true"></i>
        </span>
        <span class="app-toast-content">
            <strong>Informação</strong>
            <span th:text="${info}"></span>
        </span>
        <button class="app-toast-close" type="button" data-toast-close aria-label="Fechar aviso">×</button>
    </div>
</div>
</body>
</html>
