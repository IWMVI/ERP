<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos | ERP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside class="sidebar"><a th:href="@{/}" class="sidebar-brand"><span class="brand-mark">ERP</span><span>Gestão Empresarial</span></a><nav class="sidebar-nav"><a th:href="@{/}" class="nav-item">Início</a><span class="sidebar-section-title">Cadastros</span><a th:href="@{/clientes}" class="nav-item">Clientes</a><a th:href="@{/fornecedores}" class="nav-item">Fornecedores</a><a th:href="@{/produtos}" class="nav-item active">Produtos</a><a th:href="@{/estoque}" class="nav-item">Estoque</a></nav></aside><div class="app-main"><header class="topbar"><span class="topbar-title">Produtos</span></header><main class="content"><div class="page-heading"><div><h1>Produtos</h1><p class="muted">Catálogo comercial e parâmetros de estoque.</p></div><a class="button" th:href="@{/produtos/novo}">Novo produto</a></div><form class="filter-bar" method="get"><input name="q" th:value="${q}" placeholder="Buscar por nome ou código"><button type="submit">Buscar</button></form><div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div><div class="table-wrapper"><table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Venda</th><th>Saldo</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="p:${produtos}"><td th:text="${p.codigo}"></td><td th:text="${p.nome}"></td><td th:text="${p.categoria}"></td><td th:text="${#numbers.formatDecimal(p.precoVenda,1,2)}"></td><td th:text="${p.saldoEstoque}"></td><td><span class="badge" th:text="${p.ativo?'Ativo':'Inativo'}"></span></td><td><a th:href="@{/produtos/{id}/editar(id=${p.id})}">Editar</a> <form class="inline-form" th:action="@{/produtos/{id}/status(id=${p.id})}" method="post"><button class="link-button" type="submit" th:text="${p.ativo?'Inativar':'Ativar'}"></button></form></td></tr></tbody></table></div></main></div></div></body></html>
