<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produto | ERP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="content form-page"><div class="page-heading"><div><h1 th:text="${id==null?'Novo produto':'Editar produto'}"></h1><p class="muted">Informações comerciais e parâmetros mínimos de estoque.</p></div></div><form th:action="${id==null}?@{/produtos}:@{/produtos/{id}(id=${id})}" th:object="${produtoRequest}" method="post" class="form-panel"><div class="form-grid"><div><label>Código/SKU</label><input th:field="*{codigo}"><small class="field-error" th:errors="*{codigo}"></small></div><div><label>Nome</label><input th:field="*{nome}"></div><div><label>Categoria</label><input th:field="*{categoria}"></div><div><label>Unidade</label><select th:field="*{unidadeMedida}"><option th:each="u:${unidades}" th:value="${u}" th:text="${u}"></option></select></div><div><label>Preço de venda</label><input type="number" step="0.01" th:field="*{precoVenda}"></div><div><label>Custo</label><input type="number" step="0.01" th:field="*{custo}"></div><div><label>Estoque mínimo</label><input type="number" step="0.001" th:field="*{estoqueMinimo}"></div></div><div class="actions"><a class="button secondary" th:href="@{/produtos}">Cancelar</a><button type="submit">Salvar</button></div></form></main></body></html>
