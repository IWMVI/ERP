<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produto | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/cadastros.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('produtos')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Cadastros / Produtos')}"></header>
        <main class="content registry-page">
            <div class="registry-page-header">
                <h1 th:text="${id == null ? 'Novo produto' : 'Editar produto'}"></h1>
                <p>Identificação, valores e parâmetros operacionais.</p>
            </div>

            <form class="registry-form-stack"
                  th:action="${id == null} ? @{/produtos} : @{/produtos/{id}(id=${id})}"
                  th:object="${produtoRequest}"
                  method="post"
                  enctype="multipart/form-data">
                <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Identificação</h2></div>
                    <div class="panel-body">
                        <div class="registry-image-field" data-image-field>
                            <div class="registry-image-preview product-image-preview">
                                <img th:if="${fotoAtual != null}"
                                     th:src="@{'/uploads/' + ${fotoAtual}}"
                                     alt="Imagem do produto"
                                     data-image-preview>
                                <div th:unless="${fotoAtual != null}" class="registry-image-placeholder" data-image-placeholder>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 8-9 5-9-5"></path><path d="m3 8 9-5 9 5v8l-9 5-9-5Z"></path></svg>
                                </div>
                            </div>
                            <div class="registry-image-info">
                                <label>Imagem do produto</label>
                                <div class="registry-image-file-name" data-image-file-name th:text="${fotoAtual != null ? 'Imagem cadastrada' : 'Nenhum arquivo selecionado'}"></div>
                                <small>JPG, PNG ou WEBP. Tamanho máximo: 5 MB.</small>
                            </div>
                            <div class="registry-image-actions">
                                <label class="button secondary compact" for="fotoProduto">Escolher arquivo</label>
                                <button type="button" class="button secondary compact" data-image-clear hidden>Limpar seleção</button>
                                <input id="fotoProduto" class="visually-hidden" type="file" name="foto" accept="image/jpeg,image/png,image/webp" data-image-input>
                            </div>
                        </div>

                        <div class="form-grid registry-fields-after-media">
                            <div><label for="codigo">Código / SKU</label><input id="codigo" th:field="*{codigo}" autocomplete="off"><small class="field-error" th:errors="*{codigo}"></small></div>
                            <div><label for="gtin">GTIN / EAN</label><input id="gtin" th:field="*{gtin}" data-mask="gtin" inputmode="numeric" maxlength="14"><small class="field-error" th:errors="*{gtin}"></small></div>
                            <div class="full-width"><label for="nome">Nome</label><input id="nome" th:field="*{nome}"><small class="field-error" th:errors="*{nome}"></small></div>
                            <div class="full-width"><label for="descricao">Descrição</label><textarea id="descricao" th:field="*{descricao}" rows="3" maxlength="1000"></textarea></div>
                        </div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Classificação</h2></div>
                    <div class="panel-body form-grid form-grid-three">
                        <div><label for="marca">Marca</label><input id="marca" th:field="*{marca}"></div>
                        <div><label for="categoria">Categoria</label><input id="categoria" th:field="*{categoria}"></div>
                        <div><label for="subcategoria">Subcategoria</label><input id="subcategoria" th:field="*{subcategoria}"></div>
                        <div><label for="unidadeMedida">Unidade</label><select id="unidadeMedida" th:field="*{unidadeMedida}"><option th:each="unidade : ${unidades}" th:value="${unidade}" th:text="${unidade}"></option></select></div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Comercial</h2></div>
                    <div class="panel-body form-grid">
                        <div>
                            <label for="custoVisual">Custo</label>
                            <div class="input-prefix"><span>R$</span><input id="custoVisual" type="text" inputmode="numeric" autocomplete="off" data-money-input data-money-target="custo"></div>
                            <input type="hidden" id="custo" th:field="*{custo}" data-money-value>
                            <small class="field-error" th:errors="*{custo}"></small>
                        </div>
                        <div>
                            <label for="precoVendaVisual">Preço de venda</label>
                            <div class="input-prefix"><span>R$</span><input id="precoVendaVisual" type="text" inputmode="numeric" autocomplete="off" data-money-input data-money-target="precoVenda"></div>
                            <input type="hidden" id="precoVenda" th:field="*{precoVenda}" data-money-value>
                            <small class="field-error" th:errors="*{precoVenda}"></small>
                        </div>
                    </div>
                </section>

                <section class="registry-form-section">
                    <div class="registry-section-header"><h2>Estoque</h2></div>
                    <div class="panel-body form-grid">
                        <div><label for="estoqueMinimo">Estoque mínimo</label><input id="estoqueMinimo" type="number" min="0" step="0.001" th:field="*{estoqueMinimo}" inputmode="decimal"></div>
                        <div><label for="estoqueMaximo">Estoque máximo</label><input id="estoqueMaximo" type="number" min="0" step="0.001" th:field="*{estoqueMaximo}" inputmode="decimal"></div>
                        <div class="full-width"><label for="localizacao">Localização</label><input id="localizacao" th:field="*{localizacao}"></div>
                    </div>
                </section>

                <div class="registry-form-actions">
                    <div class="registry-actions-buttons">
                        <a class="button secondary" th:href="@{/produtos}">Cancelar</a>
                        <button type="submit">Salvar produto</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<script th:src="@{/js/cadastros.js}" defer></script>
</body>
</html>
