<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditoria | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('auditoria')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Administração / Auditoria')}"></header>
        <main class="content registry-page">
            <div class="page-heading">
                <div><h1>Auditoria de ações</h1><p class="muted">Consulte operações realizadas no sistema.</p></div>
            </div>
            <div class="registry-toolbar">
                <form method="get" th:action="@{/auditoria}" class="form-grid panel panel-body">
                    <input type="text" name="usuario" th:value="${usuario}" placeholder="Usuário">
                    <input type="text" name="entidade" th:value="${entidade}" placeholder="Entidade">
                    <input type="date" name="inicio" th:value="${inicio}">
                    <input type="date" name="fim" th:value="${fim}">
                    <button type="submit">Filtrar</button>
                </form>
            </div>
            <section class="registry-card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Data/hora</th><th>Usuário</th><th>Operação</th><th>Entidade</th><th>ID</th><th>Descrição</th></tr></thead>
                        <tbody>
                        <tr th:each="registro : ${registros}">
                            <td th:text="${registro.dataHora}"></td>
                            <td th:text="${registro.usuario}"></td>
                            <td th:text="${registro.operacao}"></td>
                            <td th:text="${registro.entidade}"></td>
                            <td th:text="${registro.entidadeId}"></td>
                            <td th:text="${registro.descricao}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(registros)}"><td colspan="6">Nenhum registro encontrado.</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav th:replace="~{fragments/pagination :: pagination(${paginacao})}"></nav>
            </section>
        </main>
    </div>
</div>
</body>
</html>
