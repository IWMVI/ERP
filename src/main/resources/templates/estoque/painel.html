<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('estoque')}"></aside>
    <div class="app-main">
        <header class="topbar"><span class="topbar-title">Operação / Estoque</span></header>
        <main class="content">
            <div class="page-heading">
                <div><h1>Controle de estoque</h1><p class="muted">Saldos derivados de movimentações rastreáveis.</p></div>
                <a class="button" th:href="@{/estoque/movimentar}">Nova movimentação</a>
            </div>
            <div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div>
            <section class="dashboard-grid">
                <article class="metric-card">
                    <div class="metric-label">Produtos cadastrados</div>
                    <div class="metric-value" th:text="${#lists.size(produtos)}"></div>
                </article>
                <article class="metric-card">
                    <div class="metric-label">Abaixo do mínimo</div>
                    <div class="metric-value" th:text="${#lists.size(abaixoMinimo)}"></div>
                </article>
            </section>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Código</th><th>Produto</th><th>Saldo</th><th>Mínimo</th><th>Situação</th></tr></thead>
                    <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.codigo}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.saldoEstoque}"></td>
                        <td th:text="${produto.estoqueMinimo}"></td>
                        <td><span class="badge" th:text="${produto.saldoEstoque.compareTo(produto.estoqueMinimo) < 0 ? 'Abaixo do mínimo' : 'Normal'}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="page-heading">
                <div><h2>Histórico</h2><p class="muted">Filtre por produto e período.</p></div>
            </div>
            <form class="form-grid panel panel-body" method="get">
                <select name="produtoId">
                    <option value="">Todos os produtos</option>
                    <option th:each="produto : ${produtos}" th:value="${produto.id}" th:text="${produto.codigo + ' - ' + produto.nome}" th:selected="${produtoId == produto.id}"></option>
                </select>
                <input type="date" name="inicio" th:value="${inicio}">
                <input type="date" name="fim" th:value="${fim}">
                <button type="submit">Filtrar</button>
            </form>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Origem</th><th>Usuário</th></tr></thead>
                    <tbody>
                    <tr th:each="movimentacao : ${movimentacoes}">
                        <td th:text="${movimentacao.dataHora}"></td>
                        <td th:text="${movimentacao.produto.codigo + ' - ' + movimentacao.produto.nome}"></td>
                        <td th:text="${movimentacao.tipo}"></td>
                        <td th:text="${movimentacao.quantidade}"></td>
                        <td th:text="${movimentacao.origem}"></td>
                        <td th:text="${movimentacao.usuario}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movimentacoes)}"><td colspan="6">Nenhuma movimentação encontrada.</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
