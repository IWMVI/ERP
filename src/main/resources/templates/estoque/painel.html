<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('estoque')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Operação / Estoque')}"></header>
        <main class="content registry-page">
            <div class="page-heading">
                <div><h1>Controle de estoque</h1><p class="muted">Saldos derivados de movimentações rastreáveis.</p></div>
                <th:block th:replace="~{fragments/buttons :: link(@{/estoque/movimentar}, 'Nova movimentação', null)}"></th:block>
            </div>

            <section class="dashboard-grid">
                <article class="metric-card"><div class="metric-label">Produtos cadastrados</div><div class="metric-value" th:text="${#lists.size(produtos)}"></div></article>
                <article class="metric-card"><div class="metric-label">Abaixo do mínimo</div><div class="metric-value" th:text="${#lists.size(abaixoMinimo)}"></div></article>
            </section>

            <section class="registry-card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Código</th><th>Produto</th><th>Saldo</th><th>Mínimo</th><th>Situação</th></tr></thead>
                        <tbody>
                        <tr th:each="produto : ${produtosPagina}">
                            <td th:text="${produto.codigo}"></td>
                            <td th:text="${produto.nome}"></td>
                            <td th:text="${produto.saldoEstoque}"></td>
                            <td th:text="${produto.estoqueMinimo}"></td>
                            <td><span class="badge" th:classappend="${produto.saldoEstoque.compareTo(produto.estoqueMinimo) >= 0} ? ' success'" th:text="${produto.saldoEstoque.compareTo(produto.estoqueMinimo) < 0 ? 'Abaixo do mínimo' : 'Normal'}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(produtosPagina)}"><td colspan="5">Nenhum produto cadastrado.</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav th:replace="~{fragments/pagination :: pagination(${paginacaoProdutos})}"></nav>
            </section>

            <div class="page-heading section-heading">
                <div><h2>Histórico de movimentações</h2><p class="muted">Filtre por produto e período.</p></div>
            </div>
            <div class="registry-toolbar">
                <form class="form-grid panel panel-body" method="get">
                    <select name="produtoId">
                        <option value="">Todos os produtos</option>
                        <option th:each="produto : ${produtos}" th:value="${produto.id}" th:text="${produto.codigo + ' - ' + produto.nome}" th:selected="${produtoId == produto.id}"></option>
                    </select>
                    <input type="date" name="inicio" th:value="${inicio}">
                    <input type="date" name="fim" th:value="${fim}">
                    <button type="submit">Filtrar</button>
                </form>
            </div>

            <section class="registry-card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Origem</th><th>Usuário</th></tr></thead>
                        <tbody>
                        <tr th:each="movimentacao : ${movimentacoes}">
                            <td th:text="${movimentacao.dataHora}"></td>
                            <td th:text="${movimentacao.produtoCodigo + ' - ' + movimentacao.produtoNome}"></td>
                            <td th:text="${movimentacao.tipo}"></td>
                            <td th:text="${movimentacao.quantidade}"></td>
                            <td th:text="${movimentacao.origem}"></td>
                            <td th:text="${movimentacao.usuario}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(movimentacoes)}"><td colspan="6">Nenhuma movimentação encontrada.</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav th:replace="~{fragments/pagination :: pagination(${paginacaoMovimentacoes})}"></nav>
            </section>
        </main>
    </div>
</div>
</body>
</html>
