<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Movimentar estoque | ERP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="content"><div class="page-heading"><div><h1>Nova movimentação</h1><p class="muted">Toda alteração de saldo exige uma movimentação registrada.</p></div></div><form th:action="@{/estoque/movimentacoes}" th:object="${movimentacaoRequest}" method="post" class="panel panel-body form-panel"><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><div class="full-width"><label>Produto</label><select th:field="*{produtoId}"><option value="">Selecione</option><option th:each="p:${produtos}" th:value="${p.id}" th:text="${p.codigo+' - '+p.nome+' | saldo '+p.saldoEstoque}"></option></select><small class="field-error" th:errors="*{produtoId}"></small></div><div><label>Tipo</label><select th:field="*{tipo}"><option th:each="t:${tipos}" th:value="${t}" th:text="${t}"></option></select></div><div><label>Quantidade</label><input type="number" step="0.001" th:field="*{quantidade}"><small class="field-error" th:errors="*{quantidade}"></small></div><div class="full-width"><label>Origem</label><input th:field="*{origem}" placeholder="Ex.: ajuste manual, inventário, recebimento"><small class="field-error" th:errors="*{origem}"></small></div></div><div class="actions"><a class="button secondary" th:href="@{/estoque}">Cancelar</a><button type="submit">Registrar movimentação</button></div></form></main></body></html>
