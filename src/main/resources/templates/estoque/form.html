<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimentar estoque | ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('estoque-movimentar')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Operação / Estoque / Nova movimentação')}"></header>
        <main class="content registry-page">
            <div class="page-heading"><div><h1>Nova movimentação</h1><p class="muted">Toda alteração de saldo exige uma movimentação registrada.</p></div></div>
            <section class="panel registry-form">
                <div class="panel-header"><h2>Dados da movimentação</h2></div>
                <div class="panel-body">
                    <form th:action="@{/estoque/movimentacoes}" th:object="${movimentacaoRequest}" method="post">
                        <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
                        <div class="form-grid">
                            <div class="full-width"><label for="produtoId">Produto</label><select id="produtoId" th:field="*{produtoId}"><option value="">Selecione</option><option th:each="produto : ${produtos}" th:value="${produto.id}" th:text="${produto.codigo + ' - ' + produto.nome + ' | saldo ' + produto.saldoEstoque}"></option></select><small class="field-error" th:errors="*{produtoId}"></small></div>
                            <div><label for="tipo">Tipo</label><select id="tipo" th:field="*{tipo}"><option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option></select></div>
                            <div><label for="quantidade">Quantidade</label><input id="quantidade" type="number" step="0.001" th:field="*{quantidade}"><small class="field-error" th:errors="*{quantidade}"></small></div>
                            <div class="full-width"><label for="origem">Origem</label><input id="origem" th:field="*{origem}" placeholder="Ex.: ajuste manual, inventário, recebimento"><small class="field-error" th:errors="*{origem}"></small></div>
                        </div>
                        <div class="actions"><a class="button secondary" th:href="@{/estoque}">Cancelar</a><button type="submit">Registrar movimentação</button></div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
