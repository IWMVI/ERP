spring.application.name=erp
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.admin.nome=${APP_ADMIN_NOME:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.senha=${APP_ADMIN_SENHA:}

erp.upload-dir=${ERP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Privacidade e sessão
app.privacy.controller-name=${APP_PRIVACIDADE_CONTROLADOR:Controlador não configurado}
app.privacy.contact=${APP_PRIVACIDADE_CONTATO:privacidade@empresa.local}
app.privacy.officer=${APP_PRIVACIDADE_ENCARREGADO:Não designado}
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
